<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eee4" />
    <title>念念 · 慢慢学英语</title>
    <meta
      name="description"
      content="念念，慢慢学英语。从 hi、morning、good、my 开始。字母、音标、拼写、短句、GitHub 按钮词和间隔记忆。单文件，可直接放上 GitHub Pages。"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F3EEE4'/%3E%3Crect x='4.5' y='9' width='16' height='16' rx='2.2' fill='%23FBF8F2' stroke='%231E1A16' stroke-width='1.8'/%3E%3Cpath d='M8 15h9M8 19h6.5' stroke='%231E1A16' stroke-width='1.7' stroke-linecap='round'/%3E%3Ccircle cx='22.2' cy='11.2' r='6.4' fill='%23C4512C'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #f3eee4;
        --surface: #fbf8f2;
        --ink: #1e1a16;
        --muted: #6f675e;
        --line: #e3dacb;
        --clay: #c4512c;
        --clay-soft: #f6e3d8;
        --on-clay: #fff8f4;
        --good: #2c6b4a;
        --good-soft: #e4f0e8;
        --bad: #9d3b32;
        --bad-soft: #f8e6e3;
        --chip: #efe7da;
        --display: "Iowan Old Style", Palatino, "Palatino Linotype", "Songti SC", "Source Han Serif SC", serif;
        --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
        --ipa: "Noto Sans", "PingFang SC", "Hiragino Sans GB", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--ink); }
      body {
        font-family: var(--sans);
        font-size: 17px;
        line-height: 1.5;
        min-height: 100dvh;
      }
      button, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
      #app { min-height: 100dvh; }
      .page {
        width: min(32rem, 100%);
        margin: 0 auto;
        padding: calc(1.15rem + env(safe-area-inset-top)) 1rem calc(1.5rem + env(safe-area-inset-bottom));
      }
      h1, h2, .display { font-family: var(--display); font-weight: 560; letter-spacing: -0.02em; }
      h1 { margin: 0; font-size: 1.35rem; line-height: 1.15; }
      .brand { font-size: 3.25rem; line-height: 0.95; margin: 0; }
      .muted { color: var(--muted); }
      .kicker { margin: 0; font-size: 0.82rem; color: var(--muted); }
      .ipa { font-family: "Noto Sans", var(--sans); color: var(--clay); letter-spacing: 0.01em; }
      .top { display: flex; align-items: center; gap: 0.6rem; }
      .top-title { flex: 1; min-width: 0; }
      .icon, .pill, .primary, .quiet, .choice, .tile, .pack, .row, .stat, .card, .letter, .phon, .pair, .grade {
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .icon {
        width: 2.75rem; height: 2.75rem; border-radius: 999px;
        display: grid; place-items: center; font-size: 1.5rem; line-height: 1; padding: 0;
      }
      .pill {
        min-height: 2.5rem; border-radius: 999px; padding: 0 0.9rem;
        background: var(--chip); font-size: 0.92rem; font-weight: 700;
      }
      .pill.on, .seg button.on { background: var(--clay); color: var(--on-clay); border-color: var(--clay); }
      .primary, .quiet {
        width: 100%; min-height: 3.1rem; border-radius: 1rem; font-weight: 700;
      }
      .primary { background: var(--clay); color: var(--on-clay); border-color: var(--clay); }
      .primary:disabled { opacity: 0.45; }
      .quiet { background: transparent; }
      .stats { display: flex; gap: 0.5rem; margin-top: 1.1rem; }
      .stat { flex: 1; border-radius: 1rem; padding: 0.7rem 0.75rem; }
      .stat b { display: block; font-family: var(--display); font-size: 1.25rem; font-weight: 560; }
      .hero {
        margin-top: 1.1rem; width: 100%; text-align: left; border: 0; border-radius: 1.4rem;
        background: var(--clay); color: var(--on-clay); padding: 1.15rem 1.2rem;
      }
      .hero p { margin: 0; }
      .hero .display { font-size: 1.85rem; margin-top: 0.2rem; }
      .hero .sub { margin-top: 0.45rem; color: rgba(255, 248, 244, 0.86); font-size: 0.95rem; }
      h2 { font-size: 1.55rem; margin: 1.7rem 0 0.4rem; }
      .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
      .row {
        width: 100%; display: flex; gap: 0.75rem; align-items: center;
        text-align: left; border-left: 0; border-right: 0; border-top: 0; border-radius: 0;
        background: transparent; padding: 0.75rem 0; min-height: 4.2rem;
      }
      .num { width: 2rem; font-family: var(--display); color: var(--clay); font-size: 1.15rem; }
      .row span { display: block; }
      .grow { flex: 1; min-width: 0; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
      .pack, .card, .choice, .pair { border-radius: 1rem; text-align: left; }
      .pack, .card { padding: 0.85rem; }
      .pack b, .card b { font-family: var(--display); font-size: 1.45rem; font-weight: 560; display: block; }
      .meter { height: 0.35rem; background: var(--chip); border-radius: 999px; overflow: hidden; margin-top: 0.9rem; }
      .meter i { display: block; height: 100%; background: var(--clay); }
      .word { font-family: var(--display); font-size: clamp(2.1rem, 8vw, 3.4rem); line-height: 1.05; margin: 0.2rem 0; overflow-wrap: anywhere; }
      .word.sm { font-size: clamp(1.6rem, 6vw, 2.3rem); }
      input[type="text"], input[type="search"] {
        width: 100%; border: 1px solid var(--line); background: var(--surface);
        border-radius: 1rem; padding: 0.85rem 1rem; font-size: 16px; font-family: var(--display);
      }
      input[type="search"] { font-family: var(--sans); font-size: 16px; }
      .tiles { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.7rem; }
      .tile {
        width: 3rem; height: 3rem; border-radius: 0.9rem;
        font-family: var(--display); font-size: 1.35rem;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.75rem; }
      .feedback { margin-top: 1rem; border-radius: 1.2rem; padding: 1rem; }
      .ok { background: var(--good-soft); }
      .bad { background: var(--bad-soft); }
      .hook { margin-top: 0.8rem; padding-top: 0.7rem; border-top: 1px dashed var(--line); }
      .letters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.45rem; }
      .letter { height: 4.4rem; border-radius: 0.95rem; font-family: var(--display); font-size: 1.7rem; }
      .seg { display: flex; gap: 0.4rem; margin: 0.8rem 0; }
      .seg button { flex: 1; min-height: 2.6rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
      .phon { width: 100%; border-radius: 1rem; padding: 0.7rem 0.2rem; }
      .phon b { font-family: "Noto Sans", var(--sans); font-size: 1.45rem; font-weight: 500; display: block; }
      .grades { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.45rem; margin-top: 0.8rem; }
      .grade { min-height: 3rem; border-radius: 0.9rem; font-weight: 700; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .foot { margin-top: 1.6rem; font-size: 0.92rem; }
      @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
        <div id="app">正在打开念念…</div>
    <script>
      async function boot() {
        const names = ["a0.js","a1.js","a2.js","a3.js","a4.js"];
        let code = "";
        for (const name of names) {
          const response = await fetch(name);
          if (!response.ok) throw new Error(name);
          code += await response.text();
          if (!code.endsWith("\n")) code += "\n";
        }
        (0, eval)(code);
      }
      boot().catch(() => {
        const node = document.getElementById("app");
        if (node) node.textContent = "打不开。请用浏览器打开这个网页地址，不要直接点开文件。";
      });
    </script>

  </body>
</html>
